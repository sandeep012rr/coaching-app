    <!-- Buttons -->

    <button onclick="nextSlide()" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/40 text-white flex items-center justify-center text-xs backdrop-blur-sm z-10">❯</button>

    <!-- Dots -->
    <div id="slider-dots" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex items-center gap-1.5 z-10"></div>
</div>

<script>
    let currentSlide = 0;
    const track = document.getElementById('slider-track');
    const slides = track ? track.children : [];
    const totalSlides = slides.length;
    const dotsContainer = document.getElementById('slider-dots');

    if (dotsContainer && totalSlides > 1) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = `w-2 h-2 rounded-full transition-all cursor-pointer ${i === 0 ? 'bg-blue-600 w-4' : 'bg-slate-300'}`;
            dot.onclick = () => goToSlide(i);
            dotsContainer.appendChild(dot);
        }
    }

    function updateSlider() {
        if (!track) return;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;
        const dots = dotsContainer ? dotsContainer.children : [];
        for (let i = 0; i < dots.length; i++) {
            dots[i].className = `w-2 h-2 rounded-full transition-all cursor-pointer ${i === currentSlide ? 'bg-blue-600 w-4' : 'bg-slate-300'}`;
        }
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % totalSlides;
        updateSlider();
    }

    function prevSlide() {
        currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
        updateSlider();
    }

    function goToSlide(index) {
        currentSlide = index;
        updateSlider();
    }

    if (totalSlides > 1) {
        setInterval(nextSlide, 3500);
    }
  </script>
