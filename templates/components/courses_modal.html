<div id="courses-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-lg w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-blue-700">school</span>
                <h3 class="font-bold text-slate-800 text-base">All Special Education Courses</h3>
            </div>
            <button onclick="closeCoursesModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>

        <div class="p-4 overflow-y-auto space-y-3.5">
            {% for c in courses %}
            <div class="border border-slate-200 rounded-xl p-3.5 bg-white shadow-sm flex flex-col gap-2">
                <div class="flex items-start justify-between">
                    <div>
                        <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded">{{ c.badge }}</span>
                        <h4 class="font-bold text-slate-900 text-sm mt-1">{{ c.title }}</h4>
                        {% if c.coupon %}
                        <p class="text-[10px] text-indigo-700 font-bold mt-0.5 bg-indigo-50 px-2 py-0.5 rounded inline-block">
                            🎟️ Coupon: {{ c.coupon }}
                        </p>
                        {% endif %}
                    </div>
                    <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">{{ c.discount }}</span>
                </div>
                <div class="flex items-center justify-between pt-1">
                    <div class="flex items-center gap-2">
                        <span class="text-base font-extrabold text-slate-900">₹ {{ c.price }}</span>
                        <span class="text-xs text-slate-400 line-through">₹ {{ c.orig_price }}</span>
                    </div>
                    <a href="https://wa.me/919828625119?text=Mujhe%20{{ c.title }}%20Join%20karna%20hai{% if c.coupon %}%20Coupon:{{ c.coupon }}{% endif %}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-1.5 rounded-lg shadow-sm">
                        Join Now
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
