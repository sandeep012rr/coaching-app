<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
    <h2 class="text-base font-bold text-red-600 flex items-center gap-1.5 mb-3">
        <span class="material-symbols-outlined">live_tv</span> Live Stream / Class Setup
    </h2>
    <form method="POST" class="space-y-3">
        <input type="hidden" name="action" value="update_live">
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Live Class Topic / Title:</label>
            <input type="text" name="live_title" value="{{ config.live_title }}" class="w-full border rounded-lg p-2.5 text-xs" required>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">YouTube Link (Unlisted/Live):</label>
            <input type="text" name="live_url" value="{{ config.live_url }}" class="w-full border rounded-lg p-2.5 text-xs" required>
        </div>
        <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" name="is_live" id="is_live" {% if config.is_live %}checked{% endif %} class="w-4 h-4 text-blue-600">
            <label for="is_live" class="text-xs font-semibold text-slate-700">Live Video Student App me dikhayein</label>
        </div>
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-5 py-2.5 rounded-lg">Update Live Stream</button>
    </form>
</div>
