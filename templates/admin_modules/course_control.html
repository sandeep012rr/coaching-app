<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
    <h2 class="text-base font-bold text-indigo-700 flex items-center gap-1.5 mb-3">
        <span class="material-symbols-outlined">local_offer</span> Course Discount & Coupon Codes
    </h2>
    <div class="space-y-3">
        {% for c in courses %}
        <form method="POST" class="flex flex-wrap md:flex-nowrap items-center gap-3 p-3 border rounded-xl bg-slate-50 text-xs">
            <input type="hidden" name="action" value="update_course">
            <input type="hidden" name="course_id" value="{{ c.id }}">
            <div class="w-full md:w-1/3">
                <p class="font-bold text-slate-800">{{ c.title }}</p>
                <p class="text-[10px] text-slate-400">{{ c.badge }}</p>
            </div>
            <div class="w-1/3 md:w-24">
                <label class="text-[10px] text-slate-500 block">Price (₹):</label>
                <input type="number" name="price" value="{{ c.price }}" class="w-full border rounded p-1.5 text-xs font-bold" required>
            </div>
            <div class="w-1/3 md:w-28">
                <label class="text-[10px] text-slate-500 block">Discount Tag:</label>
                <input type="text" name="discount" value="{{ c.discount }}" class="w-full border rounded p-1.5 text-xs">
            </div>
            <div class="w-1/3 md:w-28">
                <label class="text-[10px] text-slate-500 block">Coupon Code:</label>
                <input type="text" name="coupon" value="{{ c.coupon }}" placeholder="DISCOUNT50" class="w-full border rounded p-1.5 text-xs uppercase font-mono">
            </div>
            <div class="w-full md:w-auto mt-2 md:mt-4">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-1.5 rounded-lg text-xs">Save</button>
            </div>
        </form>
        {% endfor %}
    </div>
</div>
