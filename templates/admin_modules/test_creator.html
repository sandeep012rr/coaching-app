<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
    <h2 class="text-base font-bold text-green-700 flex items-center gap-1.5 mb-3">
        <span class="material-symbols-outlined">add_task</span> Create New Test Series
    </h2>
    <form method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="hidden" name="action" value="create_test">
        <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">Test Title:</label>
            <input type="text" name="title" placeholder="Jaise: RPSC Special Edu Mock Test" class="w-full border rounded-lg p-2 text-xs" required>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Duration (Minutes):</label>
            <input type="number" name="duration" value="30" class="w-full border rounded-lg p-2 text-xs" required>
        </div>
        <div class="md:col-span-3">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-5 py-2.5 rounded-lg">Create Test</button>
        </div>
    </form>
</div>
